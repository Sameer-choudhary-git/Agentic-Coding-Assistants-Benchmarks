name: golden-ci
on:
  push:
    paths: ["golden/**"]
  pull_request:
    paths: ["golden/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golden
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: golden/requirements.txt}
      - run: pip install -r requirements.txt pytest
      - run: ruff check agentbench --select E9,F --isolated
      - run: python -m pytest -q tests
