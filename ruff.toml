# Lint configuration for the platform's own Python code (evaluator, analysis, tests).
# Benchmark task code is excluded: starter code is intentionally defective.
line-length = 140
target-version = "py310"
extend-exclude = ["benchmark_tasks", "artifacts", "frontend", "backend", "node_modules", "golden"]  # golden/ is linted by golden-ci.yml

[lint]
select = ["E", "F", "W", "B"]
ignore = ["B905"]
