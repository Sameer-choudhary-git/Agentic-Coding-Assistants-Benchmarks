# Reviewed balanced core for the tool study (read by `python -m agentbench export-app`).
#
# How it was made:
#   1. Automatic eligibility (agentbench/app_export.py: core_eligible): no solution-hint or weak-test flag,
#      domain confidence >= 0.7, reference-fix QualityScore >= 80 and the reference fix applies to the base
#      commit, at least one FAIL_TO_PASS and one PASS_TO_PASS test.
#   2. Manual review of every eligible candidate's issue text in performance, refactoring, security_fix and
#      feature_implementation, and of the bug_fix / frontend_visual picks: is the task really of that
#      domain? Wrong labels are corrected below (label_corrections), which also changes the domain the app
#      shows and scores for that task.
#   3. Five confirmed tasks per domain, spread over difficulty, source, repository and language where the
#      confirmed pool allows it (performance has no confirmed medium task with regression tests).
#
# The review was done by the AI assistant that built the dataset (2026-11-22). Before publication, a
# second human reviewer should confirm each entry (agreement can be reported as a kappa).
reviewer: "AI-assisted review, pending human confirmation"
reviewed_on: 2026-11-22

